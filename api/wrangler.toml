name = "poetic-typewriter-api"
main = "src/index.js"
compatibility_date = "2026-05-11"

[vars]
ALLOWED_ORIGIN = ""
COOKIE_SECURE = "true"
HARD_CPS_LIMIT = "20"
RUN_START_LIMIT_MAX = "5"
RUN_START_LIMIT_WINDOW_MS = "60000"
SUSPICIOUS_CPS_LIMIT = "12"
SUSPICIOUS_SAMPLE_VARIANCE_MIN = "12"
RUN_TOKEN_TTL_MS = "300000"
SERVER_FLOOR_TOLERANCE_MS = "250"

[[d1_databases]]
binding = "DB"
database_name = "poetic-typewriter"
# Local CLI workflows still require UUID-shaped IDs. Replace these before any remote deploy.
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"